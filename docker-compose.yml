name: toss-o

# Sunucu kayıtları (IP adresi içerir) en fazla 5 x 10 MB tutulur, eskiler silinir
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tosso
      POSTGRES_USER: tosso
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tosso}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tosso -d tosso"]
      interval: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://tosso:${DB_PASSWORD:-tosso}@db:5432/tosso
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlanmalı}
      SEED: ${SEED:-true}
      # web (nginx) docker ağından gelir; giriş sınırı gerçek istemci IP'sine uygulansın
      TRUST_PROXY: 172.16.0.0/12
      # Google Play satın alma doğrulaması (Play Console servis hesabı)
      GOOGLE_PLAY_PACKAGE: ${GOOGLE_PLAY_PACKAGE:-}
      # Admin paneline girebilecek kullanıcı adları (virgülle)
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        MAP_STYLE: ${MAP_STYLE:-/map/styles/liberty}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
