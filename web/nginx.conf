# Harita ve yedek yazı tipleri için önbellek. Dış servislere (OpenFreeMap,
# Google) yalnızca bu sunucu bağlanır; ziyaretçinin IP adresi yurt dışına gitmez.
proxy_cache_path /var/cache/nginx/map levels=1:2 keys_zone=map:50m max_size=5g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/gfonts levels=1:2 keys_zone=gfonts:5m max_size=500m inactive=90d use_temp_path=off;

# Önde HTTPS vekili (Caddy) varsa gerçek şema oradan gelir
map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}

server {
  listen 80;
  # profil fotoğrafı yüklemesi için (api en fazla 4 MB kabul eder)
  client_max_body_size 5m;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/json application/javascript text/css application/x-protobuf application/wasm;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OpenFreeMap vekili: stil, tile, sprite ve harita yazı tipleri
  location /map/ {
    proxy_pass https://tiles.openfreemap.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host tiles.openfreemap.org;
    # Ziyaretçiye ait hiçbir bilgi iletilmez
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Set-Cookie;
    proxy_cache map;
    proxy_cache_valid 200 7d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating;
    proxy_cache_lock on;
    # Stil ve TileJSON içindeki adresler bu sunucuya çevrilir
    sub_filter_types application/json;
    sub_filter 'https://tiles.openfreemap.org/' '$public_scheme://$http_host/map/';
    sub_filter_once off;
    add_header X-Cache $upstream_cache_status;
  }

  # Flutter web'in emoji vb. yedek yazı tipleri (Google Fonts) vekili
  location /gfonts/ {
    proxy_pass https://fonts.gstatic.com/s/;
    proxy_ssl_server_name on;
    proxy_set_header Host fonts.gstatic.com;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Referer "";
    proxy_hide_header Set-Cookie;
    proxy_cache gfonts;
    proxy_cache_valid 200 90d;
    proxy_cache_use_stale error timeout updating;
  }

  # Harita kütüphanesi ES modülleri (.mjs) JavaScript olarak sunulmalı
  location ~ \.mjs$ {
    types { }
    default_type application/javascript;
  }

  # Flutter başlatıcısı: yedek yazı tipleri kendi vekilimizden gelsin
  location = /flutter_bootstrap.js {
    sub_filter_types application/javascript;
    sub_filter '__TOSSO_FONT_FALLBACK__' '/gfonts/';
    sub_filter_once on;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
