name: throw_app
description: toss-o — mektubunu kağıt uçak yap, haritada fırlat.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.27.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Caveat-OFL.txt
  # Yazı tipleri uygulamanın içinde: çalışırken Google sunucularına istek gitmez
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Medium.ttf
          weight: 500

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  # Android 8+ uyarlanabilir ikon: simge telefonun maskesini dolduracak kadar büyük
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png
  adaptive_icon_foreground_inset: 0
  ios: false
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#ffffff"
    theme_color: "#0e1b33"
