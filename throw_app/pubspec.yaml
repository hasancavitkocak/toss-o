name: throw_app
description: toss-o — mektubunu kağıt uçak yap, haritada fırlat.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  maplibre_gl: ^0.27.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  image_path: assets/icon.png
  android: true
  ios: false
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#ffffff"
    theme_color: "#0e1b33"
